services:

  app:
    image: ghcr.io/noornizam/in-time-app:latest
    volumes:
      - storage_data:/var/www/html/storage/app/public
    environment:
      APP_NAME: "${APP_NAME:-In Time}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-http://localhost}"
      APP_LOCALE: "${APP_LOCALE:-en}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: in_time
      DB_USERNAME: in_time
      DB_PASSWORD: "${DB_PASSWORD}"
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      FILESYSTEM_DISK: public
      MAIL_MAILER: "${MAIL_MAILER:-smtp}"
      MAIL_HOST: "${MAIL_HOST:-smtp.gmail.com}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-leenocx@gmail.com}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-fbfrasrnkclnmubp}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-leenocx@gmail.com}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-In Time}"
      LOG_CHANNEL: stack
      LOG_LEVEL: "${LOG_LEVEL:-warning}"
      BCRYPT_ROUNDS: "${BCRYPT_ROUNDS:-12}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  queue:
    image: ghcr.io/noornizam/in-time-app:latest
    volumes:
      - storage_data:/var/www/html/storage/app/public
    environment:
      APP_NAME: "${APP_NAME:-In Time}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-http://localhost}"
      APP_LOCALE: "${APP_LOCALE:-en}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: in_time
      DB_USERNAME: in_time
      DB_PASSWORD: "${DB_PASSWORD}"
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      FILESYSTEM_DISK: public
      MAIL_MAILER: "${MAIL_MAILER:-smtp}"
      MAIL_HOST: "${MAIL_HOST:-smtp.gmail.com}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-leenocx@gmail.com}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-fbfrasrnkclnmubp}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-leenocx@gmail.com}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-In Time}"
      LOG_CHANNEL: stack
      LOG_LEVEL: "${LOG_LEVEL:-warning}"
      BCRYPT_ROUNDS: "${BCRYPT_ROUNDS:-12}"
    command: php artisan queue:listen --tries=3 --timeout=90
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: ghcr.io/noornizam/in-time-app:latest
    volumes:
      - storage_data:/var/www/html/storage/app/public
    environment:
      APP_NAME: "${APP_NAME:-In Time}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-http://localhost}"
      APP_LOCALE: "${APP_LOCALE:-en}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: in_time
      DB_USERNAME: in_time
      DB_PASSWORD: "${DB_PASSWORD}"
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      FILESYSTEM_DISK: public
      LOG_CHANNEL: stack
    command: php artisan schedule:work
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: ghcr.io/noornizam/in-time-nginx:latest
    volumes:
      - storage_data:/var/www/storage:ro
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: mysql:8.0
    volumes:
      - dbdata:/var/lib/mysql
    environment:
      MYSQL_DATABASE: in_time
      MYSQL_USER: in_time
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  storage_data:
  dbdata:

services:

  app:
    build:
      context: .
    volumes:
      - storage_data:/var/www/html/storage/app/public
    environment:
      APP_NAME: "${APP_NAME:-In Time}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-http://localhost}"
      APP_LOCALE: "${APP_LOCALE:-en}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: in_time
      DB_USERNAME: in_time
      DB_PASSWORD: "${DB_PASSWORD}"
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      FILESYSTEM_DISK: public
      MAIL_MAILER: "${MAIL_MAILER:-smtp}"
      MAIL_HOST: "${MAIL_HOST:-smtp.elasticemail.com}"
      MAIL_PORT: "${MAIL_PORT:-2525}"
      MAIL_USERNAME: "${MAIL_USERNAME:-srsn3561@gmail.com}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-FC5791526F68AE844A0539B0876A7FF449BD}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-srsn3561@gmail.com}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-In Time Co.}"
      LOG_CHANNEL: stack
      LOG_LEVEL: "${LOG_LEVEL:-warning}"
      BCRYPT_ROUNDS: "${BCRYPT_ROUNDS:-12}"
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  queue:
    build:
      context: .
    volumes:
      - storage_data:/var/www/html/storage/app/public
    environment:
      APP_NAME: "${APP_NAME:-In Time}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-http://localhost}"
      APP_LOCALE: "${APP_LOCALE:-en}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: in_time
      DB_USERNAME: in_time
      DB_PASSWORD: "${DB_PASSWORD}"
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      FILESYSTEM_DISK: public
      MAIL_MAILER: "${MAIL_MAILER:-smtp}"
      MAIL_HOST: "${MAIL_HOST:-smtp.elasticemail.com}"
      MAIL_PORT: "${MAIL_PORT:-2525}"
      MAIL_USERNAME: "${MAIL_USERNAME:-srsn3561@gmail.com}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-FC5791526F68AE844A0539B0876A7FF449BD}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-srsn3561@gmail.com}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-In Time Co.}"
      LOG_CHANNEL: stack
      LOG_LEVEL: "${LOG_LEVEL:-warning}"
    command: php artisan queue:listen --tries=3 --timeout=90
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
    volumes:
      - storage_data:/var/www/html/storage/app/public
    environment:
      APP_NAME: "${APP_NAME:-In Time}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-http://localhost}"
      APP_LOCALE: "${APP_LOCALE:-en}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: in_time
      DB_USERNAME: in_time
      DB_PASSWORD: "${DB_PASSWORD}"
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      FILESYSTEM_DISK: public
      LOG_CHANNEL: stack
    command: php artisan schedule:work
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - .:/var/www/html:ro
      - storage_data:/var/www/storage:ro
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - internal
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  db:
    image: mysql:8.0
    volumes:
      - dbdata:/var/lib/mysql
    environment:
      MYSQL_DATABASE: in_time
      MYSQL_USER: in_time
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    ports:
      - "${DB_PORT_HOST:-3307}:3306"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  build:
    image: node:24-alpine
    profiles: ["setup"]
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm run build"

volumes:
  storage_data:
  dbdata:

networks:
  internal:
    driver: bridge
